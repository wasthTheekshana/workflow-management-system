# Paste into ~/dok-stack/nginx/nginx.conf before the default catch-all.
# Certificate folder name under live/ must match what certbot issued.

# workflow - HTTP redirect
server {
    listen 80;
    server_name wk.testsys.shop wk-office.testsys.shop;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# workflow - app + api
server {
    listen 443 ssl;
    server_name wk.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 100m;

    location ~ /\.env { deny all; return 404; }

    # The trailing slash strips /api, the backend routes have no prefix.
    location /api/ {
        proxy_pass         http://workflow-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://workflow-web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# workflow - OnlyOffice document server (needs websockets)
server {
    listen 443 ssl;
    server_name wk-office.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 100m;

    location / {
        proxy_pass         http://workflow-onlyoffice:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        upgrade;
        proxy_read_timeout 300s;
    }
}
