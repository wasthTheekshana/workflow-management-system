services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-workflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-workflow_engine}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-workflow} -d ${DB_NAME:-workflow_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      ONLYOFFICE_CALLBACK_BASE_URL: http://api:3000
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
      FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-5174}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    volumes:
      - documents:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  # On-prem S3-compatible document store. Start with: docker compose --profile minio up -d
  # then set STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000, S3_FORCE_PATH_STYLE=true,
  # S3_BUCKET, S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (= MINIO_ROOT_USER/PASSWORD) in .env
  # and create the bucket in the console at http://localhost:9001.
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set to use minio}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    ports:
      - "127.0.0.1:8082:80"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
        VITE_ONLYOFFICE_DOCUMENT_SERVER_URL: ${VITE_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:8082}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      - api

volumes:
  pgdata:
  documents:
  miniodata:
